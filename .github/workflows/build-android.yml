name: Build StepUp Arabic Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "tests/**"
      - "scripts/**"
      - "audio/**"
      - "requirements-audio.txt"
      - "requirements-sofelia.txt"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "tests/**"
      - "scripts/**"
      - "audio/**"
      - "requirements-audio.txt"
      - "requirements-sofelia.txt"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-persistence-final2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for content checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lessons, vocabulary and JavaScript
        run: node tests/validate-content.cjs

      - name: Test local save, restore and Android fallback
        run: node tests/test-persistence.cjs

      - name: Test editable content-review workflow
        run: python tests/test-content-review.py

      - name: Set up Python for licensed audio assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch selected licensed human audio clips
        run: |
          python -m pip install -r requirements-audio.txt
          python scripts/fetch_audio.py

      - name: Check out pinned Nabra Arabic TTS generator
        uses: actions/checkout@v4
        with:
          repository: Oddadmix/nabra-tts
          ref: 16b5281ce61993df3526740990cf845a3f3036f4
          path: .build/nabra-tts
          persist-credentials: false

      - name: Build Nabra audio generator
        working-directory: .build/nabra-tts
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Generate offline MSA word and alphabet audio
        run: node scripts/generate_nabra_audio.mjs

      - name: Install CPU-only Sofelia Palestinian speech generator
        run: |
          python -m pip install --timeout 240 --retries 5 --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --timeout 240 --retries 5 -r requirements-sofelia.txt

      - name: Generate offline Palestinian Arabic word audio
        run: python scripts/generate_sofelia_audio.py

      - name: Bundle Arabic font and verify every audio file
        run: |
          python scripts/fetch_arabic_font.py
          python tests/verify-generated-audio.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Package the current offline learning app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html
          test "$(wc -c < android/app/src/main/assets/index.html)" -gt 10000
          mkdir -p android/app/src/main/assets/audio
          cp audio/ATTRIBUTION.md android/app/src/main/assets/audio/ATTRIBUTION.md
          cp audio/manifest.json android/app/src/main/assets/audio/manifest.json
          find audio -maxdepth 1 -type f -name "*.wav" -exec cp {} android/app/src/main/assets/audio/ \;
          mkdir -p android/app/src/main/assets/audio/generated android/app/src/main/assets/audio/fonts
          cp -R audio/generated/. android/app/src/main/assets/audio/generated/
          cp -R audio/fonts/. android/app/src/main/assets/audio/fonts/

      - name: Configure persistent Android signing key
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              echo "Create a persistent Android signing key and add all four secrets before building the main-branch APK."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/stepup-arabic-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$KEYSTORE_PATH"
            printf 'ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Android APKs
        working-directory: android
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            gradle --no-daemon --stacktrace :app:assembleRelease
          fi

      - name: Verify APKs and embedded offline content
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          source = Path("../index.html").read_bytes()
          apk_paths = [Path("app/build/outputs/apk/debug/app-debug.apk")]
          import os
          if os.environ.get("GITHUB_REF") == "refs/heads/main":
              apk_paths.append(Path("app/build/outputs/apk/release/app-release.apk"))
          for apk in apk_paths:
              assert apk.is_file() and apk.stat().st_size > 100_000, f"APK missing or unexpectedly small: {apk}"
              with ZipFile(apk) as archive:
                  assert archive.testzip() is None, f"APK ZIP integrity check failed: {apk}"
                  assert archive.read("assets/audio/manifest.json") == Path("../audio/manifest.json").read_bytes(), f"APK audio attribution manifest mismatch: {apk}"
                  bundled = archive.read("assets/index.html")
                  assert bundled == source, f"APK does not contain the current index.html: {apk}"
                  for name in ("msa-in-morning.wav", "msa-city-small.wav", "msa-one-day.wav", "msa-on-distant-planet.wav", "msa-their-food-is-the-same.wav"):
                      source_audio = Path("../audio") / name
                      assert source_audio.is_file(), f"Required audio source missing: {name}"
                      assert archive.read("assets/audio/" + name) == source_audio.read_bytes(), f"APK audio mismatch: {name} ({apk})"
                  for manifest_name in ("generated/spoken-manifest.json", "generated/formal-manifest.json"):
                      source_manifest = Path("../audio") / manifest_name
                      manifest = json.loads(source_manifest.read_text(encoding="utf-8"))
                      assert archive.read("assets/audio/" + manifest_name) == source_manifest.read_bytes(), f"APK manifest mismatch: {manifest_name} ({apk})"
                      for item in manifest["files"]:
                          relative = item["file"]
                          source_audio = Path("../audio") / relative
                          assert source_audio.is_file(), f"Generated audio missing from build: {relative}"
                          assert archive.read("assets/audio/" + relative) == source_audio.read_bytes(), f"APK generated audio mismatch: {relative} ({apk})"
                  for font_name in ("fonts/NotoSansArabic.ttf", "fonts/OFL.txt"):
                      source_font = Path("../audio") / font_name
                      assert archive.read("assets/audio/" + font_name) == source_font.read_bytes(), f"APK Arabic font mismatch: {font_name} ({apk})"
              print(f"APK verified: {apk} — {apk.stat().st_size:,} bytes; embedded HTML: {len(source):,} bytes")
          PY
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK root was not found"; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner was not found in Android build-tools"; exit 1; }
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk
          fi

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STEPUP_RELEASE_APK_PATH: ${{ github.ref == 'refs/heads/main' && 'android/app/build/outputs/apk/release/app-release.apk' || '' }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python tests/android-emulator-smoke.py

      - name: Prepare a clearly named APK
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/StepUp-Arabic-v2.0.0.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/StepUp-Arabic-v2.0.0.apk
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-Arabic-Android
          path: ${{ github.ref == 'refs/heads/main' && 'android/app/build/outputs/apk/release/StepUp-Arabic-v2.0.0.apk' || 'android/app/build/outputs/apk/debug/StepUp-Arabic-v2.0.0.apk' }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: StepUp Arabic Android v2.0.0
          body: |
            StepUp Arabic Android app.
            Offline Hebrew UI with 57 learning units: 24 Palestinian spoken Arabic and 33 MSA. Includes smart review, dictionary, favorites, sentence audio, daily goals, dark theme and local progress.
            Beginner alphabet, connected letter forms, vowels, reading, lesson quizzes and two bundled human MSA listening clips.
            Signed APK for manual installation. Android 6.0 (API 23) or newer.
          files: android/app/build/outputs/apk/release/StepUp-Arabic-v2.0.0.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
