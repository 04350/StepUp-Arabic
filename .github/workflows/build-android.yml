name: Build StepUp Arabic Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "tests/**"
      - "scripts/**"
      - "audio/**"
      - "requirements-audio.txt"
      - ".github/workflows/build-android.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "android/**"
      - "tests/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-persistence-final
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for content checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lessons, vocabulary and JavaScript
        run: node tests/validate-content.cjs

      - name: Test local save, restore and Android fallback
        run: node tests/test-persistence.cjs

      - name: Set up Python for licensed audio assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch selected licensed human audio clips
        run: |
          python -m pip install -r requirements-audio.txt
          python scripts/fetch_audio.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Package the current offline learning app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html
          test "$(wc -c < android/app/src/main/assets/index.html)" -gt 10000
          mkdir -p android/app/src/main/assets/audio
          cp audio/ATTRIBUTION.md android/app/src/main/assets/audio/ATTRIBUTION.md
          cp audio/manifest.json android/app/src/main/assets/audio/manifest.json
          find audio -maxdepth 1 -type f -name "*.wav" -exec cp {} android/app/src/main/assets/audio/ \;

      - name: Build Android APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and embedded offline content
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          source = Path("../index.html").read_bytes()
          assert apk.is_file() and apk.stat().st_size > 100_000, "APK missing or unexpectedly small"
          with ZipFile(apk) as archive:
              assert archive.testzip() is None, "APK ZIP integrity check failed"
              assert archive.read("assets/audio/manifest.json") == Path("../audio/manifest.json").read_bytes(), "APK audio attribution manifest mismatch"
              bundled = archive.read("assets/index.html")
              assert bundled == source, "APK does not contain the current index.html"
              for name in ("msa-in-morning.wav", "msa-city-small.wav", "msa-one-day.wav", "msa-on-distant-planet.wav", "msa-their-food-is-the-same.wav"):
                  source_audio = Path("../audio") / name
                  assert source_audio.is_file(), f"Required audio source missing: {name}"
                  assert archive.read("assets/audio/" + name) == source_audio.read_bytes(), f"APK audio mismatch: {name}"
          print(f"APK verified: {apk.stat().st_size:,} bytes; embedded HTML: {len(source):,} bytes")
          PY
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK root was not found"; exit 1; }
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "apksigner was not found in Android build-tools"; exit 1; }
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.stepuparabic.app/.MainActivity --ez stepup_smoke true
            sleep 5
            adb shell pidof com.stepuparabic.app
            adb shell dumpsys activity activities | grep -q "com.stepuparabic.app/.MainActivity"
            adb shell run-as com.stepuparabic.app cat files/stepuparabic-progress.json > /tmp/stepup-progress-first.json
            test -s /tmp/stepup-progress-first.json
            grep -q '"ms-a1"' /tmp/stepup-progress-first.json
            grep -q '"activeTrack":"spoken"' /tmp/stepup-progress-first.json
            adb shell am force-stop com.stepuparabic.app
            adb shell am start -n com.stepuparabic.app/.MainActivity --ez stepup_smoke true
            sleep 5
            adb logcat -d -s StepUpArabic:I | grep -q 'SAVE_SMOKE.*PERSISTENCE_RESTORED'
            adb shell run-as com.stepuparabic.app cat files/stepuparabic-progress.json > /tmp/stepup-progress-after-restart.json
            test -s /tmp/stepup-progress-after-restart.json
            grep -q '"ms-a1"' /tmp/stepup-progress-after-restart.json
            grep -q '"activeTrack":"spoken"' /tmp/stepup-progress-after-restart.json
            ! adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"

      - name: Prepare a clearly named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/StepUp-Arabic-v0.1.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-Arabic-Android
          path: android/app/build/outputs/apk/debug/StepUp-Arabic-v0.1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: StepUp Arabic Android v0.1.0
          body: |
            StepUp Arabic Android app.
            Offline Hebrew UI with 49 learning units: 20 Palestinian spoken Arabic and 29 MSA.
            Beginner alphabet, connected letter forms, vowels, reading, lesson quizzes and two bundled human MSA listening clips.
            Signed APK for manual installation. Android 6.0 (API 23) or newer.
          files: android/app/build/outputs/apk/debug/StepUp-Arabic-v0.1.0.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
