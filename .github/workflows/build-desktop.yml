name: Build StepUp Arabic desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
      - "index.html"
      - "tests/**"
      - "scripts/**"
      - "audio/**"
      - "requirements-audio.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for content checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lessons, vocabulary and JavaScript
        run: node tests/validate-content.cjs

      - name: Set up Python for licensed audio assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch selected licensed human audio clips
        run: |
          python -m pip install -r requirements-audio.txt
          python scripts/fetch_audio.py
        continue-on-error: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: desktop/go.mod

      - name: Embed the current offline learning app and audio
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "index.html" -Destination "desktop/app.html" -Force
          New-Item -ItemType Directory -Force -Path "desktop/audio" | Out-Null
          Copy-Item -LiteralPath "audio/ATTRIBUTION.md" -Destination "desktop/audio/ATTRIBUTION.md" -Force
          Get-ChildItem -Path "audio" -Filter "*.wav" -File | ForEach-Object { Copy-Item $_.FullName -Destination "desktop/audio" -Force }

      - name: Build native Windows app
        working-directory: desktop
        shell: pwsh
        run: |
          go mod tidy
          go mod download
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/StepUp-Arabic.exe .
          if (!(Test-Path "dist/StepUp-Arabic.exe")) { throw "EXE was not created" }
          $exe = Get-Item "dist/StepUp-Arabic.exe"
          if ($exe.Length -lt 1000000) { throw "EXE is unexpectedly small; the embedded app may be missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Output is not a Windows PE executable" }
          Write-Host "Built $($exe.Length)-byte Windows executable"

      - name: Smoke test Windows app startup
        shell: pwsh
        run: |
          $appPath = (Resolve-Path "desktop/dist/StepUp-Arabic.exe").Path
          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "StepUp English closed during startup (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-Arabic-Windows-x64
          path: desktop/dist/StepUp-Arabic.exe
          if-no-files-found: error
          retention-days: 30
