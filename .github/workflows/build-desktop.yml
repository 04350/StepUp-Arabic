name: Build StepUp Arabic desktop app

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-desktop.yml"
      - "index.html"
      - "tests/**"
      - "scripts/**"
      - "audio/**"
      - "requirements-audio.txt"
      - "requirements-sofelia.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for content checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate lessons, vocabulary and JavaScript
        run: node tests/validate-content.cjs

      - name: Test local save, restore and Android fallback
        run: node tests/test-persistence.cjs

      - name: Set up Python for licensed audio assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch selected licensed human audio clips
        run: |
          python -m pip install -r requirements-audio.txt
          python scripts/fetch_audio.py

      - name: Generate offline MSA word and alphabet audio
        shell: pwsh
        run: |
          npm install --no-save --no-package-lock nabra-tts@0.1.0 onnxruntime-web@1.31.1
          if ($LASTEXITCODE -ne 0) { throw "Could not install the Nabra audio generator" }
          node scripts/generate_nabra_audio.mjs
          if ($LASTEXITCODE -ne 0) { throw "MSA and alphabet audio generation failed" }

      - name: Install CPU-only Sofelia Palestinian speech generator
        shell: pwsh
        run: |
          python -m pip install --timeout 240 --retries 5 --index-url https://download.pytorch.org/whl/cpu torch
          if ($LASTEXITCODE -ne 0) { throw "Could not install CPU PyTorch" }
          python -m pip install --timeout 240 --retries 5 -r requirements-sofelia.txt
          if ($LASTEXITCODE -ne 0) { throw "Could not install Sofelia dependencies" }

      - name: Generate offline Palestinian Arabic word audio
        run: python scripts/generate_sofelia_audio.py

      - name: Bundle Arabic font and verify every audio file
        run: |
          python scripts/fetch_arabic_font.py
          python tests/verify-generated-audio.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: desktop/go.mod

      - name: Embed the current offline learning app and audio
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "index.html" -Destination "desktop/app.html" -Force
          New-Item -ItemType Directory -Force -Path "desktop/audio" | Out-Null
          Copy-Item -LiteralPath "audio/ATTRIBUTION.md" -Destination "desktop/audio/ATTRIBUTION.md" -Force
          Copy-Item -LiteralPath "audio/manifest.json" -Destination "desktop/audio/manifest.json" -Force
          Get-ChildItem -Path "audio" -Filter "*.wav" -File | ForEach-Object { Copy-Item $_.FullName -Destination "desktop/audio" -Force }
          New-Item -ItemType Directory -Force -Path "desktop/audio/generated", "desktop/audio/fonts" | Out-Null
          Copy-Item -Path "audio/generated/*" -Destination "desktop/audio/generated" -Recurse -Force
          Copy-Item -Path "audio/fonts/*" -Destination "desktop/audio/fonts" -Force
          foreach ($clip in @("msa-in-morning.wav", "msa-city-small.wav", "msa-one-day.wav", "msa-on-distant-planet.wav", "msa-their-food-is-the-same.wav")) {
            $clipPath = Join-Path "desktop/audio" $clip
            if (!(Test-Path $clipPath)) { throw "Required human audio clip is missing: $clip" }
            if ((Get-Item $clipPath).Length -lt 1000) { throw "Audio clip is unexpectedly small: $clip" }
          }

      - name: Build native Windows app
        working-directory: desktop
        shell: pwsh
        run: |
          go mod tidy
          go mod download
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw "Windows audio endpoint tests failed" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/StepUp-Arabic.exe .
          if (!(Test-Path "dist/StepUp-Arabic.exe")) { throw "EXE was not created" }
          $exe = Get-Item "dist/StepUp-Arabic.exe"
          if ($exe.Length -lt 1000000) { throw "EXE is unexpectedly small; the embedded app may be missing" }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Output is not a Windows PE executable" }
          Write-Host "Built $($exe.Length)-byte Windows executable"

      - name: Smoke test Windows app startup
        shell: pwsh
        run: |
          $appPath = (Resolve-Path "desktop/dist/StepUp-Arabic.exe").Path
          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 8
          $app.Refresh()
          if ($app.HasExited) { throw "StepUp Arabic closed during startup (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id -Force

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: StepUp-Arabic-Windows-x64
          path: desktop/dist/StepUp-Arabic.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Windows download on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: StepUp Arabic v0.1.0
          body: |
            StepUp Arabic Windows desktop app.
            Offline Hebrew UI, 49 Arabic learning units (20 spoken Palestinian Arabic and 29 MSA), beginner alphabet path, and bundled human MSA listening samples.
            Requires Microsoft Edge WebView2 Runtime.
          files: desktop/dist/StepUp-Arabic.exe
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
